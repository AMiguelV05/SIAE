[project]
name = "siae-ml"
version = "0.1.0"
description = "Pronóstico de demanda de SIAE: datos sintéticos, modelos y evaluación"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siae_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
